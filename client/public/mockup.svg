<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="title desc">
  <title id="title">MeetMidway trip room preview</title>
  <desc id="desc">A UI mockup showing a friends list, map markers, and place results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2f7" />
    </linearGradient>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7efe3" />
      <stop offset="1" stop-color="#dce7f3" />
